[project]
name = "qwen-manga-annotations"
version = "0.1.0"
description = "Resumable panel and page captions from Magi3 sidecars"
requires-python = ">=3.11,<3.13"
dependencies = ["httpx>=0.28,<0.29", "pillow>=11,<13"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11"]
server = ["vllm>=0.11.1,<0.12"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
